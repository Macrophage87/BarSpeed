name: Release

on:
  push:
    tags: ["v*"]
  # Environments whose git proxy blocks tag pushes can dispatch the release
  # directly; the tag is then created by the release action itself.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create/release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # secrets are not usable in step-level `if`; surface via env instead.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore (if configured)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Assemble release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      # Gradle always writes app-release.apk, so every download collides in the
      # Downloads folder and none of them says which app or which version it is.
      - name: Name the APK for humans
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/BarSpeed-${version}.apk"
          ls -l release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: release-artifacts/BarSpeed-*.apk
          generate_release_notes: true
