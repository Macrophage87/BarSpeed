name: Release

on:
  push:
    tags: ["v*"]
  # Environments whose git proxy blocks tag pushes can dispatch the release
  # directly; the tag is then created by the release action itself.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create/release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The tag reaches scripts only through this variable, quoted, never as
      # ${{ }} text inside a run block: a dispatch input is free text.
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    # Secrets live on the one step that uses each of them, never in job-level
    # env. The decoded keystore file is deleted right after the signed build,
    # before any third-party action runs, and again at job end whatever failed.
    steps:
      - uses: actions/checkout@v7

      - name: Check the release tag
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag must look like v1.2.3" >&2
            exit 1
          fi

      # Secrets are not usable in step-level `if`; this step reports only
      # whether each one is set, so later gates read a boolean, not the secret.
      - name: Check which secrets are configured
        id: secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "has_keystore=$([ -n "$KEYSTORE_BASE64" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_play=$([ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Runs before the keystore exists, so this is an unsigned build: the unit
      # tests, plus the minified (R8) release build that CI never exercises. A
      # missing keep rule or a red test stops the release here, before anything
      # is signed or uploaded to Play.
      - name: Unit tests and minified release build
        run: ./gradlew test :app:assembleRelease --stacktrace

      # A release without the keystore would be unsigned and fail later at the
      # copy step with a confusing message; say why here instead.
      - name: Decode signing keystore
        env:
          HAS_KEYSTORE: ${{ steps.secrets.outputs.has_keystore }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ "$HAS_KEYSTORE" != "true" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set -- a release must be signed" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      # Google Play takes only an Android App Bundle, never an APK. The same
      # signing config signs both, so the .aab is signed with the key the APK
      # has always used; Play treats that key as the UPLOAD key and re-signs
      # with its own app signing key (Play App Signing). That Play key is a
      # fresh Google-generated one, so a Play install and a sideloaded GitHub
      # APK cannot update each other.
      - name: Assemble release APK and bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      # The signed outputs exist now; the key file is not needed again, so it
      # is gone before action-gh-release and upload-google-play run.
      - name: Delete the decoded keystore
        if: always()
        run: rm -f app/release.keystore

      # Gradle always writes app-release.apk, so every download collides in the
      # Downloads folder and none of them says which app or which version it is.
      - name: Name the APK and bundle for humans
        run: |
          set -euo pipefail
          version="$RELEASE_TAG"
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/BarSpeed-${version}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release-artifacts/BarSpeed-${version}.aab"
          ls -l release-artifacts

      # A minified release build always writes this file; its absence means
      # minification silently turned off, which #274 wants noticed, not hidden.
      # Without the mapping, a dropbox stack from a release build cannot be
      # retraced from an obfuscated frame back to a source line.
      - name: Name the mapping file for humans
        run: |
          set -euo pipefail
          version="$RELEASE_TAG"
          mapping="app/build/outputs/mapping/release/mapping.txt"
          if [ ! -f "$mapping" ]; then
            echo "::error::$mapping is missing -- release build did not minify, so no mapping was produced" >&2
            exit 1
          fi
          mkdir -p release-artifacts
          cp "$mapping" "release-artifacts/BarSpeed-${version}-mapping.txt"
          ls -l release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # A dispatch creates the tag here; without this GitHub would put it on
          # main's HEAD at this moment, not on the commit that was built.
          target_commitish: ${{ github.sha }}
          files: |
            release-artifacts/BarSpeed-*.apk
            release-artifacts/BarSpeed-*.aab
            release-artifacts/BarSpeed-*-mapping.txt
          generate_release_notes: true

      # Continuous delivery to the Play internal testing track, the owner's
      # only tester list. Skipped, not failed, until the PLAY_SERVICE_ACCOUNT_JSON
      # secret exists, so a release still publishes to GitHub before Play is
      # set up. Play's API cannot create an app: the first bundle for
      # com.macrophage.barspeed must be uploaded by hand in Play Console, and
      # every later release uploads here. Play rejects a versionCode it has
      # already seen, so re-running this job after a successful upload fails
      # here; cut a new version instead.
      - name: Upload bundle to Play internal testing
        if: ${{ steps.secrets.outputs.has_play == 'true' }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.macrophage.barspeed
          releaseFiles: release-artifacts/BarSpeed-*.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          track: internal
          status: completed
          releaseName: ${{ env.RELEASE_TAG }}

      # Belt and braces: the decoded upload key must not outlive the job,
      # whatever failed above.
      - name: Delete the decoded keystore at job end
        if: always()
        run: rm -f app/release.keystore
