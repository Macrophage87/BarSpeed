name: Release

on:
  push:
    tags: ["v*"]
  # Environments whose git proxy blocks tag pushes can dispatch the release
  # directly; the tag is then created by the release action itself.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create/release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # secrets are not usable in step-level `if`; surface via env instead.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore (if configured)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      # Google Play takes only an Android App Bundle, never an APK. The same
      # signing config signs both, so the .aab is signed with the key the APK
      # has always used; Play treats that key as the UPLOAD key and re-signs
      # with its own app signing key (Play App Signing).
      - name: Assemble release APK and bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      # Gradle always writes app-release.apk, so every download collides in the
      # Downloads folder and none of them says which app or which version it is.
      - name: Name the APK and bundle for humans
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/BarSpeed-${version}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release-artifacts/BarSpeed-${version}.aab"
          ls -l release-artifacts

      # A minified release build always writes this file; its absence means
      # minification silently turned off, which #274 wants noticed, not hidden.
      # Without the mapping, a dropbox stack from a release build cannot be
      # retraced from an obfuscated frame back to a source line.
      - name: Name the mapping file for humans
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.tag || github.ref_name }}"
          mapping="app/build/outputs/mapping/release/mapping.txt"
          if [ ! -f "$mapping" ]; then
            echo "::error::$mapping is missing -- release build did not minify, so no mapping was produced" >&2
            exit 1
          fi
          mkdir -p release-artifacts
          cp "$mapping" "release-artifacts/BarSpeed-${version}-mapping.txt"
          ls -l release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            release-artifacts/BarSpeed-*.apk
            release-artifacts/BarSpeed-*.aab
            release-artifacts/BarSpeed-*-mapping.txt
          generate_release_notes: true

      # Continuous delivery to the Play internal testing track, the owner's
      # only tester list. Skipped, not failed, until the PLAY_SERVICE_ACCOUNT_JSON
      # secret exists, so a release still publishes to GitHub before Play is
      # set up. Play's API cannot create an app: the first bundle for
      # com.macrophage.barspeed must be uploaded by hand in Play Console, and
      # every later release uploads here. Pinned by SHA (v1.1.5) because the
      # step holds the service account key.
      - name: Upload bundle to Play internal testing
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.macrophage.barspeed
          releaseFiles: release-artifacts/BarSpeed-*.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          track: internal
          status: completed
          releaseName: ${{ github.event.inputs.tag || github.ref_name }}
